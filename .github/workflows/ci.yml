name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate GitHub workflows
        shell: pwsh
        run: ./scripts/check-github-workflows.ps1

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verified Windows process host
        run: pnpm build:native:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Security suite
        run: pnpm test:sec

      - name: Real Electron browser suite
        run: pnpm test:electron

      - name: Export and audit public source
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "localbridge-public-$([guid]::NewGuid().ToString('N'))"
          ./scripts/export-public-source.ps1 -Destination $destination

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      - name: Public history audit
        shell: pwsh
        run: ./scripts/audit-public-history.ps1

      - name: Build unpacked desktop
        run: pnpm --filter @localbridge/desktop package:win:dir

      - name: Smoke packaged desktop window
        shell: pwsh
        run: |
          ./scripts/smoke-packaged-desktop.ps1 `
            -ExecutablePath 'apps/desktop/release/win-unpacked/LocalBridge MCP.exe'

      - name: Packaged MCP server suite
        env:
          LOCALBRIDGE_PACKAGED_RESOURCES: ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources
        run: pnpm exec vitest run tests/integration/packaged-desktop-server.test.ts
