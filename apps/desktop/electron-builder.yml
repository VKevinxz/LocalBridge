appId: com.localbridge.desktop
productName: LocalBridge MCP
copyright: Copyright © 2026 VKevinXZ. All rights reserved.
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "!out/server/**/*"
  - "!node_modules/@localbridge/**/*"
  - "!node_modules/clawpdf/**/*"
  - package.json
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: vendor/tunnel-client
    to: vendor/tunnel-client
  - from: vendor/node
    to: vendor/node
  - from: vendor/process-host
    to: vendor/process-host
  - from: out/server
    to: server
    filter:
      - "*.cjs"
      - "*.mjs"
      - "*.wasm"
  - from: out/server/node_modules/@napi-rs/canvas
    to: server/node_modules/@napi-rs/canvas
  - from: out/server/node_modules/@napi-rs/canvas-win32-x64-msvc
    to: server/node_modules/@napi-rs/canvas-win32-x64-msvc
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
win:
  icon: build/icon.svg
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
